[project]
name = "agentic-healthcare-assistant"
version = "0.1.0"
description = "Hybrid agentic healthcare chatbot routing between a scraped-content vector store and a relational hospital database."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
]

[tool.uv]
# This is an application, not a library: nothing imports it as a package, so
# there is no build backend and no build step.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["assistant"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
include = ["assistant", "ui"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pyright>=1.1.408",
    # 9.1.x ships an undeclared `import py` in _pytest/compat.py and fails to
    # start; pinned below that until upstream releases a fix.
    "pytest>=9.0.3,<9.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
